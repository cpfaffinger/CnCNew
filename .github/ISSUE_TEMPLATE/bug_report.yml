name: Something is wrong
description: A defect, a crash, or a place where the game behaves differently from the original Zero Hour.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not attach files, pictures or texts taken from the game (it is not ours to publish); describe what you saw instead.
  - type: textarea
    id: seen
    attributes:
      label: What happened
      description: What you saw or measured, in your own words. A crash? A unit that does something odd? A screen that looks wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the original game does, or what you think should happen.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: Map, factions, what you clicked, how long into the match. A replay or a saved game from the game's own folders is welcome if it contains no game data you are not allowed to share.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the launcher; for a source build, the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`CnCNew.Client.Stride.exe --support-bundle bundle.zip` makes a ZIP with the logs and crash reports. It holds no key and no game file; attach it here."
    validations:
      required: false
